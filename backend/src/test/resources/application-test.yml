# Tests run against an in-memory H2 database in PostgreSQL compatibility mode,
# so the test suite does not need a running PostgreSQL server.
spring:
  datasource:
    url: jdbc:h2:mem:errorvault;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
